description: |
  The game ships as a static site with no build step, deployable to
  Cloudflare Pages by pushing the repo or dragging the folder. All
  dependencies load from pinned CDN URLs via an import map. Route
  generation happens on the player's device, so no server-side GPU or
  backend is needed; large splat files can be served from R2.

acceptance_criteria:
  - "Given the repo is connected to Cloudflare Pages, when a push lands on main, then the site deploys with an empty build command and output directory /"
  - "Given the deployed site, when the page loads, then index.html, the import map and all src modules load with no console errors"
  - "Given the pinned CDN URLs, when three.js or spark.js publish a breaking major version, then the game keeps working because the versions are pinned"
  - "Given a .spz file larger than 25 MB, when it is added as a landmark, then it is served from R2 (or equivalent object storage), not bundled with the page"

test_plan:
  - "Automated: scripts/test.sh passes (syntax checks plus determinism assertions)"
  - "Manual: serve the folder with any static server and confirm the game boots with no console errors"

out_of_scope:
  - "Custom domain and TLS setup (Cloudflare handles it)"
  - "Server-side features (leaderboards, accounts)"
